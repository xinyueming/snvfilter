# SNVFilter default configuration
# Priority: CLI args > user config > default config

input:
  key_site: /mnt/nas/zrs/repos/snvfilter/test_data/database/combine.tsv            # 关键位点文件 (combine.tsv)
  product_gene: /mnt/nas/zrs/repos/snvfilter/test_data/database/zy.120.gene.list        # 产品基因列表
  hotspot_gene: /mnt/nas/zrs/repos/snvfilter/test_data/database/hotspot_gene.xls        # 热点基因文件
  gene_trans: /mnt/nas/zrs/repos/snvfilter/test_data/database/sorted.gene.tx.txt        # 基因转录本文件
  annovar_vcf: null         # ANNOVAR VCF 文件
  gene_categorie: /mnt/nas/zrs/repos/snvfilter/test_data/database/tumor-gene-20241016.xlsx  # 基因分类文件 (xlsx)
  hg19_refgene: /mnt/nas/zrs/repos/snvfilter/test_data/database/hg19_refGeneWithVer.txt     # hg19 refGene 文件
  hg19_gtf: /mnt/nas/zrs/repos/snvfilter/test_data/database/genomic.gene.gff          # hg19 GTF 文件
  modify_varannovar: /mnt/nas/zrs/repos/snvfilter/test_data/database/modify_VARAnnovar.xls  # 修改后的 varannovar 文件
  depth_tsv: null           # bamdst depth 文件
  depth_tsv_control: null   # bamdst depth control 文件
  gene_alias: /mnt/nas/zrs/repos/snvfilter/test_data/database/gene_alias.xls          # gene alias 文件
  local_freq: /mnt/nas/zrs/repos/snvfilter/test_data/database/local_freq.zip          # 本地频率文件 (zip/txt/txt,txt)
  mrd_filter: null          # MRD 过滤文件

output:
  prefix: null              # 输出前缀，默认从 VCF 文件名提取

sample:
  type: blood               # 样本类型: blood/tissue
  force_germline: false     # 强制胚系模式

flags:
  debug: false              # 调试模式
  is_brca: false            # BRCA panel
  is_lynch: false           # Lynch panel
  is_105: false             # 105/15 panel
